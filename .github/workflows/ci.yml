name: CI

on:
    push:
      branches: [master, main, next]
      tags: ['v*']
    pull_request:
      branches: [master, main, next]

jobs:
    semantic:
      runs-on: macos-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Test independent oracle and failure handling
          run: python3 -m unittest discover -s tools/fuzz -p 'test_semantic.py' -v
        - name: Compare native execution with independent semantics
          run: python3 tools/fuzz/semantic.py --seed 42 --cases 20 --timeout 60 --output semantic-repros
        - name: Known-miscompile corpus (fixed pass, live still fail)
          run: python3 tools/fuzz/known_cases.py
        - uses: actions/upload-artifact@v4
          if: failure()
          with:
            name: semantic-repros
            path: semantic-repros/
            if-no-files-found: ignore
    gc-stress:
      # Every suite test and self-contained tree program, run normally and then with the collector
      # running every Nth allocation (RAIL_GC_STRESS) and freed blocks poisoned. A collector bug
      # hides behind a correct answer at the default 1 GB arena; this makes it change the output.
      # Fails only on a difference (DIFF); a program too slow for the budget is reported, not failed.
      runs-on: macos-latest
      timeout-minutes: 45
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Programs under RAIL_GC_STRESS
          run: python3 tools/fuzz/gc_stress.py --jobs 3 --budget 30
    test:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: The runtime's source and the compiler's copy agree
          # runtime/arm64/*.s is the runtime; tools/runtime_arm64.rail is generated from it and
          # is what the compiler imports. Exits 1 when the two disagree (runtime/arm64/README.md).
          run: ./rail_native run tools/gen_runtime.rail check
        - name: The reader's path cites what exists, in file order
          # docs/COMPILER_TOUR.md against the compiler's banners and definitions, and every
          # test count the docs quote against the suite's literal (Tier 3 step 10).
          run: ./rail_native --out-prefix /tmp/tour_check run tools/verify/tour_check.rail
        - name: Run test suite (n/n)
          shell: bash
          run: |
            set +e
            ./rail_native test 2>&1 | tee /tmp/test.out
            line=$(tail -1 /tmp/test.out | grep -oE "^[0-9]+/[0-9]+ tests passed" | head -1)
            if [ -z "$line" ]; then
              echo "no n/n summary line found"
              tail -20 /tmp/test.out
              exit 1
            fi
            pass=$(printf '%s' "$line" | cut -d/ -f1)
            total=$(printf '%s' "$line" | awk -F'[/ ]' '{print $2}')
            echo "summary: $pass passed / $total total"
            if [ "$pass" != "$total" ]; then
              echo "--- failing-test summary ---"
              grep -E "FAIL|^--- " /tmp/test.out | tail -40
              exit 1
            fi
        - name: Self-compile reproduces the committed seed (one link path)
          # Since Tier 3 step 6 every compile assembles, links and signs in process
          # (tools/v5/link_lib.rail); there is no as/ld path for CI to fall back to.
          # The seed is byte-identical at any RAIL_ARENA_MB from 2000 up (measured
          # 2026-10-21, 2000 to 8000); the arena sets the first collection and so
          # the peak: 5.4 GB resident at 3000, 6.4 GB at 6000, 7.1 GB at 5000 and
          # 7000, on a 7 GB runner. The first cmp is the plan's proof: a machine the
          # house does not own rebuilds the seed from source; the second is the fixed point.
          run: |
            RAIL_ARENA_MB=3000 ./rail_native self
            cmp /tmp/rail_self ./rail_native && echo "Seed reproduced: source -> committed rail_native"
            cp /tmp/rail_self ./rail_gen1
            RAIL_ARENA_MB=3000 ./rail_gen1 self
            cmp /tmp/rail_self ./rail_gen1 && echo "Fixed point: gen1 == gen2"
        - name: The seed format is derivable from its document (two writers, one cmp)
          # docs/SEED_FORMAT.md: the Rail linker and a Python writer written from the document
          # (tools/independence/seed_writer.py) each build tools/independence/exit42.s; the
          # bytes must be identical and the file must run and exit 42 (Tier 3 step 9).
          run: bash tools/independence/seed_format_gate.sh
