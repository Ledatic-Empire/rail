name: CI

on:
    push:
      branches: [master, main, next]
      tags: ['v*']
    pull_request:
      branches: [master, main, next]

jobs:
    semantic:
      runs-on: macos-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Test independent oracle and failure handling
          run: python3 -m unittest discover -s tools/fuzz -p 'test_semantic.py' -v
        - name: Compare native execution with independent semantics
          run: python3 tools/fuzz/semantic.py --seed 42 --cases 20 --timeout 60 --output semantic-repros
        - name: Known-miscompile corpus (fixed pass, live still fail)
          run: python3 tools/fuzz/known_cases.py
        - uses: actions/upload-artifact@v4
          if: failure()
          with:
            name: semantic-repros
            path: semantic-repros/
            if-no-files-found: ignore
    gc-stress:
      # Every suite test and self-contained tree program, run normally and then with the collector
      # running every Nth allocation (RAIL_GC_STRESS) and freed blocks poisoned. A collector bug
      # hides behind a correct answer at the default 1 GB arena; this makes it change the output.
      # Fails only on a difference (DIFF); a program too slow for the budget is reported, not failed.
      runs-on: macos-latest
      timeout-minutes: 45
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Programs under RAIL_GC_STRESS
          run: python3 tools/fuzz/gc_stress.py --jobs 3 --budget 30
    test:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: The runtime's source and the compiler's copy agree
          # runtime/arm64/*.s is the runtime; tools/runtime_arm64.rail is generated from it and
          # is what the compiler imports. Exits 1 when the two disagree (runtime/arm64/README.md).
          run: ./rail_native run tools/gen_runtime.rail check
        - name: The documents cite what exists and quote the suite's count
          # docs/COMPILER_TOUR.md against the compiler's banners and definitions; every path the
          # tour and the contributor docs name; every N/N test count in the docs, README.md's
          # badge included, against the suite's literal (Tier 3 step 10; the README since 2026-10-29).
          run: ./rail_native --out-prefix /tmp/tour_check run tools/verify/tour_check.rail
        - name: The status matrix's facts are the tree's
          # docs/STATUS.md is generated from the tree (compiler lines, seed bytes and hash, stdlib
          # and shim counts). The committed copy must match a fresh run fact for fact; the
          # generated-by line and the two lines that carry the release (the title and the Release
          # row: git describe needs the tags, which a shallow checkout lacks) are the only lines
          # left out. tools/verify/check.sh section 4, in CI since 2026-10-29 after two PRs had
          # moved the seed without regenerating the matrix.
          shell: bash
          run: |
            ./rail_native --out-prefix /tmp/gen_status run tools/verify/gen_status.rail > /tmp/gen_status.log 2>&1 || { cat /tmp/gen_status.log; exit 1; }
            facts() { grep -vE '^# Rail - verified status|^> Generated by|^\| Release \|' "$1"; }
            if diff <(git show HEAD:docs/STATUS.md | facts /dev/stdin) <(facts docs/STATUS.md); then
              echo "STATUS.md: every fact matches the tree"
            else
              echo "docs/STATUS.md has drifted from the tree: regenerate it with ./rail_native run tools/verify/gen_status.rail and commit"; exit 1
            fi
        - name: Run test suite (n/n)
          shell: bash
          run: |
            set +e
            ./rail_native test 2>&1 | tee /tmp/test.out
            line=$(tail -1 /tmp/test.out | grep -oE "^[0-9]+/[0-9]+ tests passed" | head -1)
            if [ -z "$line" ]; then
              echo "no n/n summary line found"
              tail -20 /tmp/test.out
              exit 1
            fi
            pass=$(printf '%s' "$line" | cut -d/ -f1)
            total=$(printf '%s' "$line" | awk -F'[/ ]' '{print $2}')
            echo "summary: $pass passed / $total total"
            if [ "$pass" != "$total" ]; then
              echo "--- failing-test summary ---"
              grep -E "FAIL|^--- " /tmp/test.out | tail -40
              exit 1
            fi
        - name: Self-compile reproduces the committed seed (one link path)
          # Since Tier 3 step 6 every compile assembles, links and signs in process
          # (tools/v5/link_lib.rail); there is no as/ld path for CI to fall back to.
          # The seed is byte-identical at any RAIL_ARENA_MB from 2000 up (measured
          # 2026-10-21, 2000 to 8000); the arena sets the first collection and so
          # the peak: 5.4 GB resident at 3000, 6.4 GB at 6000, 7.1 GB at 5000 and
          # 7000, on a 7 GB runner. The first cmp is the plan's proof: a machine the
          # house does not own rebuilds the seed from source; the second is the fixed point.
          run: |
            RAIL_ARENA_MB=3000 ./rail_native self
            cmp /tmp/rail_self ./rail_native && echo "Seed reproduced: source -> committed rail_native"
            cp /tmp/rail_self ./rail_gen1
            RAIL_ARENA_MB=3000 ./rail_gen1 self
            cmp /tmp/rail_self ./rail_gen1 && echo "Fixed point: gen1 == gen2"
        - name: The seed format is derivable from its document (two writers, one cmp)
          # docs/SEED_FORMAT.md: the Rail linker and a Python writer written from the document
          # (tools/independence/seed_writer.py) each build tools/independence/exit42.s; the
          # bytes must be identical and the file must run and exit 42 (Tier 3 step 9).
          run: bash tools/independence/seed_format_gate.sh
    examples:
      # Every program in examples/ is a claim about the language: it must compile, run and print
      # the output committed beside it in examples/expected/ (tools/verify/examples_check.rail).
      runs-on: macos-latest
      timeout-minutes: 15
      steps:
        - uses: actions/checkout@v4
        - name: Every example compiles, runs and prints its expected output
          run: ./rail_native --out-prefix /tmp/examples_check run tools/verify/examples_check.rail
    stdlib:
      # Every stdlib module compiles when imported alone (tools/verify/stdlib_alone.rail): a module
      # that uses a name its own imports do not bring is refused by the compiler, as 18 of 61 were
      # until 2026-10-30.
      runs-on: macos-latest
      timeout-minutes: 15
      steps:
        - uses: actions/checkout@v4
        - name: Every stdlib module compiles when imported alone
          run: ./rail_native --out-prefix /tmp/stdlib_alone run tools/verify/stdlib_alone.rail
    numerics:
      # tools/verify/numerics_vs_c: the same double arithmetic written in C and in Rail, from the
      # same integer-made inputs, every result printed as its 64 bits. Both halves run here and are
      # judged, with the committed records of other machines, against the committed reference
      # (docs/NUMERICS.md sentences 7, 17 and 18). The Rail probe's x86-64 assembly is emitted
      # here by the seed and handed to the Linux job below.
      runs-on: macos-latest
      timeout-minutes: 15
      steps:
        - uses: actions/checkout@v4
        - name: Rail's doubles equal C's, bit for bit (this runner, arm64)
          run: bash tools/verify/numerics_vs_c/run_ci.sh arm64
        - name: Emit the Rail probe as x86-64 assembly
          run: |
            ./rail_native x86 tools/verify/numerics_vs_c/probe64.rail > /tmp/x86_emit.log 2>&1 || true
            test -s /tmp/rail_x86.s || { cat /tmp/x86_emit.log; exit 1; }
            cp /tmp/rail_x86.s tools/verify/numerics_vs_c/probe64_x86.s
            wc -l tools/verify/numerics_vs_c/probe64_x86.s
        - uses: actions/upload-artifact@v4
          with:
            name: numerics-arm64
            path: |
              tools/verify/numerics_vs_c/probe64_x86.s
              tools/verify/numerics_vs_c/records/c_arm64_ci.txt
              tools/verify/numerics_vs_c/records/rail_arm64_ci.txt
    numerics-x86:
      # The same probe on an x86-64 Linux runner: C through gcc, Rail through the assembly the
      # seed emitted in the job above. An open defect would be a line in known_live.txt, printed
      # as KNOWN; the list has been empty since the x86 fixes of 2026-10-29, so every test must
      # give the reference's bits.
      needs: numerics
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
        - uses: actions/checkout@v4
        - uses: actions/download-artifact@v4
          with:
            name: numerics-arm64
            path: tools/verify/numerics_vs_c
        - name: Which chip
          run: uname -m; grep -m1 'model name' /proc/cpuinfo; gcc --version | head -1; getconf GNU_LIBC_VERSION
        - name: C through gcc and Rail through its x86-64 assembly, judged
          run: bash tools/verify/numerics_vs_c/run_ci.sh x86
